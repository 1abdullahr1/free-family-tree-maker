name: free_family_tree_maker
description: A beautiful, high-performance family tree maker (local SQLite)
version: 1.0.0+1
publish_to: none
environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.4.10
  go_router: ^13.2.0
  path: ^1.8.3
  sqflite: ^2.4.0
  uuid: ^4.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4
